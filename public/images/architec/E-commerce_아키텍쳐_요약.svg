<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" width="1040" height="600" role="img" aria-label="E-커머스 시스템 아키텍처 요약" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif"><title>E-커머스 시스템 아키텍처 요약</title><defs><marker id="ep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#534AB7"/></marker><marker id="sp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#534AB7"/></marker><marker id="eg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6A62"/></marker><marker id="sg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6A62"/></marker><marker id="eo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B85420"/></marker><marker id="so" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B85420"/></marker><marker id="et" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/></marker><marker id="st" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/></marker><marker id="ed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A9A89E"/></marker><marker id="sd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A9A89E"/></marker></defs><rect width="1040" height="600" fill="#FFFFFF"/><rect x="40" y="34" width="420" height="74" rx="12" fill="#FCFCFA" stroke="#A9A89E" stroke-width="1.4" stroke-dasharray="6 5"/><text x="56" y="60" font-size="16" font-weight="700" fill="#1A1A19">Sentry</text><text x="56" y="81" font-size="12.5" fill="#5C5B55">프론트 · 백엔드 · 운영 앱이 각각 에러를 보냄</text><rect x="540" y="34" width="200" height="74" rx="12" fill="#FFFFFF" stroke="#B9B8AE" stroke-width="1.4"/><text x="556" y="60" font-size="16" font-weight="700" fill="#1A1A19">PortOne</text><text x="556" y="81" font-size="12.5" fill="#5C5B55">결제 웹훅</text><rect x="800" y="34" width="200" height="74" rx="12" fill="#FFFFFF" stroke="#B9B8AE" stroke-width="1.4"/><text x="816" y="60" font-size="16" font-weight="700" fill="#1A1A19">LLM API</text><text x="816" y="81" font-size="12.5" fill="#5C5B55">관리자 AI 어시스턴트</text><rect x="40" y="190" width="190" height="96" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.4"/><text x="56" y="216" font-size="16" font-weight="700" fill="#2E2870">브라우저</text><text x="56" y="237" font-size="12.5" fill="#5C5B55">access 토큰은</text><text x="56" y="256.0" font-size="12.5" fill="#5C5B55">메모리에만</text><rect x="282" y="190" width="222" height="96" rx="12" fill="#F5F3FF" stroke="#7C73D6" stroke-width="1.4"/><text x="298" y="216" font-size="16" font-weight="700" fill="#2E2870">Vercel · Next.js</text><text x="298" y="237" font-size="12.5" fill="#5C5B55">rewrites로 /api/*를 같은 출처로</text><text x="298" y="256.0" font-size="12.5" fill="#5C5B55">로그인·갱신·로그아웃은 BFF</text><rect x="556" y="190" width="184" height="96" rx="12" fill="#F1F0EB" stroke="#8A897F" stroke-width="1.4"/><text x="572" y="216" font-size="16" font-weight="700" fill="#1A1A19">nginx · EC2</text><text x="572" y="237" font-size="12.5" fill="#5C5B55">TLS 종료 (Let's Encrypt)</text><text x="572" y="256.0" font-size="12.5" fill="#5C5B55">웹훅 경로만 IP 허용</text><rect x="800" y="190" width="200" height="96" rx="12" fill="#F6F5F1" stroke="#8A897F" stroke-width="1.4"/><text x="816" y="216" font-size="16" font-weight="700" fill="#1A1A19">NestJS API</text><text x="816" y="237" font-size="12.5" fill="#5C5B55">결제 검증 · 정산</text><text x="816" y="256.0" font-size="12.5" fill="#5C5B55">AI 어시스턴트 도구 6종</text><rect x="40" y="390" width="190" height="80" rx="12" fill="#F8E7DA" stroke="#B85420" stroke-width="1.4"/><text x="56" y="416" font-size="16" font-weight="700" fill="#7C3511">운영 앱 (RN)</text><text x="56" y="437" font-size="12.5" fill="#5C5B55">쿠키 없이 토큰</text><rect x="800" y="390" width="200" height="80" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/><text x="816" y="416" font-size="16" font-weight="700" fill="#073F31">PostgreSQL · Redis</text><text x="816" y="437" font-size="12.5" fill="#5C5B55">마이그레이션으로만 변경</text><path d="M230,238 L280,238" fill="none" stroke="#534AB7" stroke-width="1.8" marker-end="url(#ep)"/><path d="M504,238 L554,238" fill="none" stroke="#534AB7" stroke-width="1.8" marker-end="url(#ep)"/><path d="M640,108 L640,188" fill="none" stroke="#6B6A62" stroke-width="1.8" marker-end="url(#eg)"/><path d="M740,238 L798,238" fill="none" stroke="#6B6A62" stroke-width="1.8" marker-end="url(#eg)"/><path d="M900,286 L900,388" fill="none" stroke="#0F6E56" stroke-width="1.8" marker-start="url(#st)" marker-end="url(#et)"/><path d="M900,190 L900,110" fill="none" stroke="#6B6A62" stroke-width="1.8" marker-end="url(#eg)"/><path d="M230,430 L648,430 L648,288" fill="none" stroke="#B85420" stroke-width="1.8" marker-end="url(#eo)"/><path d="M135,190 L135,110" fill="none" stroke="#A9A89E" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ed)"/><text x="393" y="318" font-size="13" font-weight="700" fill="#534AB7" text-anchor="middle">브라우저 경로는 한 홉 더 → 결제 경합의 원인</text><text x="40" y="530" font-size="13" font-weight="400" fill="#5C5B55" text-anchor="start">브라우저가 EC2를 직접 부르면 도메인이 달라 refresh 쿠키가 어긋납니다. 그래서 브라우저는 Vercel을 거쳐 같은 출처로 부르고,</text><text x="40" y="552" font-size="13" font-weight="400" fill="#5C5B55" text-anchor="start">nginx/HTTPS를 도입할 때도 이 경로는 그대로 두었습니다. 웹훅과 운영 앱은 nginx로 직접 들어옵니다.</text></svg>