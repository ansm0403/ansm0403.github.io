<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 760" width="1320" height="760" role="img" aria-label="E-커머스 시스템 아키텍처 상세" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif"><title>E-커머스 시스템 아키텍처 상세</title><defs><marker id="ep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#534AB7"/></marker><marker id="sp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#534AB7"/></marker><marker id="eg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6A62"/></marker><marker id="sg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6A62"/></marker><marker id="eo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B85420"/></marker><marker id="so" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B85420"/></marker><marker id="et" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/></marker><marker id="st" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/></marker><marker id="ed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A9A89E"/></marker><marker id="sd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A9A89E"/></marker></defs><rect width="1320" height="760" fill="#FFFFFF"/><rect x="24" y="24" width="300" height="520" rx="16" fill="none" stroke="#C9C8BF" stroke-width="1.2" stroke-dasharray="5 5"/><text x="38" y="46" font-size="12" font-weight="600" fill="#908F86" letter-spacing="1.5">CLIENT</text><rect x="348" y="24" width="290" height="520" rx="16" fill="none" stroke="#C9C8BF" stroke-width="1.2" stroke-dasharray="5 5"/><text x="362" y="46" font-size="12" font-weight="600" fill="#908F86" letter-spacing="1.5">VERCEL</text><rect x="662" y="24" width="634" height="520" rx="16" fill="none" stroke="#C9C8BF" stroke-width="1.2" stroke-dasharray="5 5"/><text x="676" y="46" font-size="12" font-weight="600" fill="#908F86" letter-spacing="1.5">AWS EC2 · DOCKER</text><rect x="24" y="574" width="1272" height="166" rx="16" fill="none" stroke="#C9C8BF" stroke-width="1.2" stroke-dasharray="5 5"/><text x="38" y="596" font-size="12" font-weight="600" fill="#908F86" letter-spacing="1.5">EXTERNAL</text><rect x="44" y="58" width="260" height="250" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.4"/><text x="60" y="84" font-size="16" font-weight="700" fill="#2E2870">브라우저 · Next.js App</text><text x="60" y="105" font-size="12" fill="#1A1A19" font-weight="600">TanStack Query 5</text><text x="60" y="123.5" font-size="12" fill="#5C5B55">staleTime을 변경 빈도에 맞춰 차등</text><text x="60" y="142.0" font-size="12" fill="#1A1A19" font-weight="600">axios 인터셉터</text><text x="60" y="160.5" font-size="12" fill="#5C5B55">동시 401 → refresh 1회 (공유 Promise)</text><text x="60" y="179.0" font-size="12" fill="#5C5B55">네트워크·5xx만 reportApiError</text><text x="60" y="197.5" font-size="12" fill="#1A1A19" font-weight="600">BroadcastChannel</text><text x="60" y="216.0" font-size="12" fill="#5C5B55">새 탭 세션 인계 · 전 탭 로그아웃</text><text x="60" y="234.5" font-size="12" fill="#1A1A19" font-weight="600">PortOne Browser SDK</text><rect x="44" y="330" width="260" height="120" rx="12" fill="#F8E7DA" stroke="#B85420" stroke-width="1.4"/><text x="60" y="356" font-size="16" font-weight="700" fill="#7C3511">운영 앱 · React Native</text><text x="60" y="377" font-size="12" fill="#5C5B55">Expo · 쿠키 없이 Bearer 토큰</text><text x="60" y="395.5" font-size="12" fill="#5C5B55">푸시 → 딥링크 → 이슈 상세</text><text x="60" y="414.0" font-size="12" fill="#5C5B55">스와이프 채점 · 생체 잠금</text><rect x="368" y="58" width="250" height="150" rx="12" fill="#F5F3FF" stroke="#7C73D6" stroke-width="1.4"/><text x="384" y="84" font-size="16" font-weight="700" fill="#2E2870">Next.js on Vercel</text><text x="384" y="105" font-size="12" fill="#1A1A19" font-weight="600">rewrites  /api/* → EC2</text><text x="384" y="123.5" font-size="12" fill="#5C5B55">브라우저에는 같은 출처로 보임</text><text x="384" y="142.0" font-size="12" fill="#1A1A19" font-weight="600">BFF Route Handler</text><text x="384" y="160.5" font-size="12" fill="#5C5B55">로그인 · 갱신 · 로그아웃 쿠키 처리</text><rect x="368" y="230" width="250" height="110" rx="12" fill="#F5F3FF" stroke="#7C73D6" stroke-width="1.4"/><text x="384" y="256" font-size="16" font-weight="700" fill="#2E2870">RSC · ISR</text><text x="384" y="277" font-size="12" fill="#5C5B55">상품 상세 prefetch → dehydrate</text><text x="384" y="295.5" font-size="12" fill="#5C5B55">→ HydrationBoundary</text><text x="384" y="314.0" font-size="12" fill="#5C5B55">ISR 캐시 HIT TTFB ~80ms</text><rect x="682" y="58" width="220" height="150" rx="12" fill="#F1F0EB" stroke="#8A897F" stroke-width="1.4"/><text x="698" y="84" font-size="16" font-weight="700" fill="#1A1A19">nginx</text><text x="698" y="105" font-size="12" fill="#5C5B55">TLS 종료 · Let's Encrypt</text><text x="698" y="123.5" font-size="12" fill="#1A1A19" font-weight="600">/webhook 경로만 PortOne IP 허용</text><text x="698" y="142.0" font-size="12" fill="#5C5B55">밀리초 액세스 로그</text><text x="698" y="160.5" font-size="12" fill="#5C5B55">(결제 경합 실측에 사용)</text><rect x="926" y="58" width="350" height="300" rx="12" fill="#F6F5F1" stroke="#8A897F" stroke-width="1.4"/><text x="942" y="84" font-size="16" font-weight="700" fill="#1A1A19">NestJS API  (/v1)</text><text x="942" y="105" font-size="12" fill="#1A1A19" font-weight="600">인증 · 상품 · 주문 · 결제 · 정산 · 관리자</text><text x="942" y="123.5" font-size="12" fill="#1A1A19" font-weight="600">결제 확정 (verify · 웹훅)</text><text x="942" y="142.0" font-size="12" fill="#5C5B55">같은 결제 행에 SELECT … FOR UPDATE</text><text x="942" y="160.5" font-size="12" fill="#5C5B55">락 후 재검증 → 이벤트 1회</text><text x="942" y="179.0" font-size="12" fill="#1A1A19" font-weight="600">Cron (10분)</text><text x="942" y="197.5" font-size="12" fill="#5C5B55">미결제 30분 주문 취소 · 재고 복원</text><text x="942" y="216.0" font-size="12" fill="#1A1A19" font-weight="600">AI 어시스턴트</text><text x="942" y="234.5" font-size="12" fill="#5C5B55">기존 서비스 6종을 도구로 · PII 마스킹 · SSE</text><text x="942" y="253.0" font-size="12" fill="#1A1A19" font-weight="600">Ops 모듈</text><text x="942" y="271.5" font-size="12" fill="#5C5B55">Sentry 이슈 2분 폴링 · AI 분석 · 푸시</text><rect x="926" y="400" width="160" height="110" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/><text x="942" y="426" font-size="16" font-weight="700" fill="#073F31">PostgreSQL</text><text x="942" y="447" font-size="12" fill="#5C5B55">TypeORM</text><text x="942" y="465.5" font-size="12" fill="#5C5B55">마이그레이션으로만</text><text x="942" y="484.0" font-size="12" fill="#5C5B55">스키마 변경</text><rect x="1116" y="400" width="160" height="110" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/><text x="1132" y="426" font-size="16" font-weight="700" fill="#073F31">Redis</text><text x="1132" y="447" font-size="12" fill="#5C5B55">ioredis</text><text x="1132" y="465.5" font-size="12" fill="#5C5B55">캐시</text><rect x="44" y="608" width="190" height="108" rx="12" fill="#FCFCFA" stroke="#A9A89E" stroke-width="1.4" stroke-dasharray="6 5"/><text x="60" y="634" font-size="16" font-weight="700" fill="#1A1A19">Sentry</text><text x="60" y="655" font-size="12" fill="#5C5B55">프론트·백엔드·앱</text><text x="60" y="673.5" font-size="12" fill="#5C5B55">3개 프로젝트 · 소스맵</text><rect x="254" y="608" width="190" height="108" rx="12" fill="#FFFFFF" stroke="#B9B8AE" stroke-width="1.4"/><text x="270" y="634" font-size="16" font-weight="700" fill="#1A1A19">SMTP</text><text x="270" y="655" font-size="12" fill="#5C5B55">이메일 인증</text><text x="270" y="673.5" font-size="12" fill="#5C5B55">회원가입</text><rect x="464" y="608" width="190" height="108" rx="12" fill="#FFFFFF" stroke="#B9B8AE" stroke-width="1.4"/><text x="480" y="634" font-size="16" font-weight="700" fill="#1A1A19">LLM API</text><text x="480" y="655" font-size="12" fill="#5C5B55">어시스턴트 도구 호출</text><text x="480" y="673.5" font-size="12" fill="#5C5B55">운영 에러 분석</text><rect x="674" y="608" width="190" height="108" rx="12" fill="#FFFFFF" stroke="#B9B8AE" stroke-width="1.4"/><text x="690" y="634" font-size="16" font-weight="700" fill="#1A1A19">PortOne V2</text><text x="690" y="655" font-size="12" fill="#5C5B55">결제 조회 · 취소</text><text x="690" y="673.5" font-size="12" fill="#5C5B55">결제 웹훅 발신</text><rect x="884" y="608" width="190" height="108" rx="12" fill="#FFFFFF" stroke="#B9B8AE" stroke-width="1.4"/><text x="900" y="634" font-size="16" font-weight="700" fill="#1A1A19">GitHub</text><text x="900" y="655" font-size="12" fill="#5C5B55">AI가 스택의 소스 읽기</text><text x="900" y="673.5" font-size="12" fill="#5C5B55">(허용 폴더만, 80줄씩)</text><rect x="1094" y="608" width="182" height="108" rx="12" fill="#FFFFFF" stroke="#B9B8AE" stroke-width="1.4"/><text x="1110" y="634" font-size="16" font-weight="700" fill="#1A1A19">푸시 알림</text><text x="1110" y="655" font-size="12" fill="#5C5B55">운영 앱으로</text><text x="1110" y="673.5" font-size="12" fill="#5C5B55">이슈 알림 전송</text><path d="M304,124 L366,124" fill="none" stroke="#534AB7" stroke-width="1.8" marker-end="url(#ep)"/><text x="335" y="116" font-size="12" font-weight="600" fill="#534AB7" text-anchor="middle">/api/*</text><path d="M618,124 L680,124" fill="none" stroke="#534AB7" stroke-width="1.8" marker-end="url(#ep)"/><path d="M902,124 L924,124" fill="none" stroke="#6B6A62" stroke-width="1.8" marker-end="url(#eg)"/><path d=