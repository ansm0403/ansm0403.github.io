<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 810" width="1320" height="810" role="img" aria-label="Ops Companion 아키텍처 상세" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif"><title>Ops Companion 아키텍처 상세</title><defs><marker id="ep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#534AB7"/></marker><marker id="sp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#534AB7"/></marker><marker id="eg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6A62"/></marker><marker id="sg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6A62"/></marker><marker id="eo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B85420"/></marker><marker id="so" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B85420"/></marker><marker id="et" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/></marker><marker id="st" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/></marker><marker id="ed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A9A89E"/></marker><marker id="sd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A9A89E"/></marker></defs><rect width="1320" height="810" fill="#FFFFFF"/><rect x="24" y="40" width="300" height="560" rx="16" fill="none" stroke="#C9C8BF" stroke-width="1.2" stroke-dasharray="5 5"/><text x="38" y="62" font-size="12" font-weight="600" fill="#908F86" letter-spacing="1.5">E-커머스 운영</text><rect x="348" y="40" width="600" height="560" rx="16" fill="none" stroke="#C9C8BF" stroke-width="1.2" stroke-dasharray="5 5"/><text x="362" y="62" font-size="12" font-weight="600" fill="#908F86" letter-spacing="1.5">EC2 · NESTJS OPS 모듈</text><rect x="972" y="40" width="324" height="560" rx="16" fill="none" stroke="#C9C8BF" stroke-width="1.2" stroke-dasharray="5 5"/><text x="986" y="62" font-size="12" font-weight="600" fill="#908F86" letter-spacing="1.5">운영 앱 · REACT NATIVE (EXPO)</text><rect x="44" y="76" width="260" height="130" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.4"/><text x="60" y="102" font-size="16" font-weight="700" fill="#2E2870">E-커머스 웹 · 백엔드</text><text x="60" y="123" font-size="12" fill="#5C5B55">운영 중 발생한 에러</text><text x="60" y="141.5" font-size="12" fill="#5C5B55">reportApiError · SDK 캡처</text><text x="60" y="160.0" font-size="12" fill="#5C5B55">웹 → 앱 연동 확인 페이지</text><rect x="44" y="236" width="260" height="120" rx="12" fill="#FCFCFA" stroke="#A9A89E" stroke-width="1.4" stroke-dasharray="6 5"/><text x="60" y="262" font-size="16" font-weight="700" fill="#1A1A19">Sentry</text><text x="60" y="283" font-size="12" fill="#5C5B55">프론트·백엔드·앱 3개 프로젝트</text><text x="60" y="301.5" font-size="12" fill="#5C5B55">이슈 · 이벤트 · 스택</text><rect x="44" y="386" width="260" height="190" rx="12" fill="#FFFFFF" stroke="#B9B8AE" stroke-width="1.4"/><text x="60" y="412" font-size="16" font-weight="700" fill="#1A1A19">GitHub (소스)</text><text x="60" y="433" font-size="12" fill="#5C5B55">AI 분석 도구가 읽는 원본</text><text x="60" y="451.5" font-size="12" fill="#1A1A19" font-weight="600">허용 폴더만 · 한 번에 80줄</text><text x="60" y="470.0" font-size="12" fill="#5C5B55"></text><text x="60" y="488.5" font-size="12" fill="#1A1A19" font-weight="600">승인된 분석대로 수정</text><text x="60" y="507.0" font-size="12" fill="#5C5B55">재현 스크립트 5/5 → 운영 배포</text><rect x="368" y="76" width="270" height="120" rx="12" fill="#F6F5F1" stroke="#8A897F" stroke-width="1.4"/><text x="384" y="102" font-size="16" font-weight="700" fill="#1A1A19">Sentry 폴러</text><text x="384" y="123" font-size="12" fill="#5C5B55">2분마다 Sentry API 조회</text><text x="384" y="141.5" font-size="12" fill="#5C5B55">새 이슈 → 인시던트 저장</text><text x="384" y="160.0" font-size="12" fill="#5C5B55">→ 푸시 발송</text><rect x="658" y="76" width="270" height="120" rx="12" fill="#F6F5F1" stroke="#8A897F" stroke-width="1.4"/><text x="674" y="102" font-size="16" font-weight="700" fill="#1A1A19">푸시 발송</text><text x="674" y="123" font-size="12" fill="#5C5B55">인시던트 id를 담은 알림</text><text x="674" y="141.5" font-size="12" fill="#5C5B55">앱 딥링크 경로로 연결</text><rect x="368" y="226" width="560" height="150" rx="12" fill="#F6F5F1" stroke="#8A897F" stroke-width="1.4"/><text x="384" y="252" font-size="16" font-weight="700" fill="#1A1A19">AI 분석기</text><text x="384" y="273" font-size="12" fill="#1A1A19" font-weight="600">입력: 스택 + 배포 사실 4줄 (정답 메모는 넣지 않음 — 테스트로 고정)</text><text x="384" y="291.5" font-size="12" fill="#1A1A19" font-weight="600">도구: 스택의 파일 읽기 (허용 폴더만, 80줄씩)</text><text x="384" y="310.0" font-size="12" fill="#1A1A19" font-weight="600">출력: 원인 · 추천 조치 · 확신도 JSON</text><text x="384" y="328.5" font-size="12" fill="#5C5B55">같은 이슈를 4가지 구성(프롬프트 · 도구 유무)으로 분석</text><rect x="658" y="406" width="270" height="170" rx="12" fill="#F6F5F1" stroke="#8A897F" stroke-width="1.4"/><text x="674" y="432" font-size="16" font-weight="700" fill="#1A1A19">채점 API</text><text x="674" y="453" font-size="12" fill="#5C5B55">블라인드: 버전을 응답에서 제거</text><text x="674" y="471.5" font-size="12" fill="#5C5B55">승인·반려 + 별점 저장</text><text x="674" y="490.0" font-size="12" fill="#5C5B55">버전별 승인율 · 별점 집계</text><rect x="368" y="406" width="270" height="170" rx="12" fill="#F6F5F1" stroke="#8A897F" stroke-width="1.4"/><text x="384" y="432" font-size="16" font-weight="700" fill="#1A1A19">이름 대조 (규칙)</text><text x="384" y="453" font-size="12" fill="#5C5B55">AI 조치 코드에서 이름 추출</text><text x="384" y="471.5" font-size="12" fill="#5C5B55">실제 소스의 이름 집합과 대조</text><text x="384" y="490.0" font-size="12" fill="#1A1A19" font-weight="600">"코드에 없는 이름" 칩</text><text x="384" y="508.5" font-size="12" fill="#5C5B55">판정은 사람에게 남김</text><rect x="992" y="76" width="284" height="130" rx="12" fill="#F8E7DA" stroke="#B85420" stroke-width="1.4"/><text x="1008" y="102" font-size="16" font-weight="700" fill="#7C3511">푸시 · 딥링크</text><text x="1008" y="123" font-size="12" fill="#5C5B55">꺼짐 · 백그라운드 · 열림</text><text x="1008" y="141.5" font-size="12" fill="#5C5B55">모두 같은 이슈 상세로 도착</text><text x="1008" y="160.0" font-size="12" fill="#5C5B55">생체 잠금은 스택 위 덮개</text><rect x="992" y="236" width="284" height="140" rx="12" fill="#F8E7DA" stroke="#B85420" stroke-width="1.4"/><text x="1008" y="262" font-size="16" font-weight="700" fill="#7C3511">이슈 상세 · AI 분석</text><text x="1008" y="283" font-size="12" fill="#5C5B55">원인 · 추천 조치 · 확신도</text><text x="1008" y="301.5" font-size="12" fill="#5C5B55">사실 메모</text><text x="1008" y="320.0" font-size="12" fill="#5C5B55">재분석 요청</text><rect x="992" y="406" width="284" height="170" rx="12" fill="#F8E7DA" stroke="#B85420" stroke-width="1.4"/><text x="1008" y="432" font-size="16" font-weight="700" fill="#7C3511">스와이프 채점</text><text x="1008" y="453" font-size="12" fill="#5C5B55">Pan 제스처 + Reanimated</text><text x="1008" y="471.5" font-size="12" fill="#5C5B55">서버 응답을 기다리지 않고 다음 카드</text><text x="1008" y="490.0" font-size="12" fill="#1A1A19" font-weight="600">실패하면 그 카드 한 장만 맨 앞으로</text><text x="1008" y="508.5" font-size="12" fill="#5C5B55">확인 항목 4개 + 별점</text><path d="M174,206 L174,234" fill="none" stroke="#A9A89E" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ed)"/><path d="M304,296 L336,296 L336,136 L366,136" fill="none" stroke="#6B6A62" stroke-width="1.8" marker-end="url(#eg)"/><path d="M638,136 L656,136" fill="none" stroke="#6B6A62" stroke-width="1.8" marker-end="url(#eg)"/><path d="M928,136 L990,136" fill="none" stroke="#B85420" stroke-width="1.8" marker-end="url(#eo)"/><path d="M366,350 L328,350 L328,440 L306,440" fill="none" stroke="#6B6A62" stroke-width="1.8" marker-end="url(#eg)"/><path d="M990,306 L930,306" fill="none" stroke="#B85420" stroke-width="1.8" marker-start="url(#so)" marker-end="url(#eo)"/><path d="M990,490 L930,490" fill="none" stroke="#B85420" stroke-width="1.8" marker-end="url(#eo)"/><path d="M503,404 L503,378" fill="none" stroke="#6B6A62" stroke-width="1.8" marker-end="url(#eg)"/><path d="M503,578 L503,590 L1134,590 L1134,578" fill="none" stroke="#B85420" stroke-width="1.8" marker-end="url(#eo)"/><text x="800" y="608" font-size="12" font-weight="600" fill="#B85420" text-anchor="middle">카드에 칩 표시</text><rect x="24" y="650" width="1272" height="140" rx="12" fill="#FCFCFA" stroke="#A9A89E" stroke-width="1.4" stroke-dasharray="6 5"/><text x="40" y="676" font-size="16" font-weight="700" fill="#1A1A19">검증 결과 (포트폴리오 본문 기준)</text><text x="40" y="697" font-size="12.5" fill="#5C5B55">1차 블라인드 채점: 승인 14/14 → 채점자가 정답을 모른 채 그럴듯하면 승인하고 있었음</text><text x="40" y="716.0" font-size="12.5" fill="#5C5B55">2차 사실 메모 + 확인 항목 4개: 방향 오류는 반려로 바뀌었지만 지어낸 이름 적발 0건</text><text x="40" y="735.0" font-size="12.5" fill="#5C5B55">3차 이름 대조 칩: 코드를 안 읽은 분석 7건 중 4건 적발, 읽은 분석 0건 (표본 7건 · 평가자 1명)</text></svg>