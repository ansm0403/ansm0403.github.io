<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" width="1040" height="500" role="img" aria-label="Ops Companion 흐름 요약" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif"><title>Ops Companion 흐름 요약</title><defs><marker id="ep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#534AB7"/></marker><marker id="sp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#534AB7"/></marker><marker id="eg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6A62"/></marker><marker id="sg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6A62"/></marker><marker id="eo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B85420"/></marker><marker id="so" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B85420"/></marker><marker id="et" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/></marker><marker id="st" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/></marker><marker id="ed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A9A89E"/></marker><marker id="sd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A9A89E"/></marker></defs><rect width="1040" height="500" fill="#FFFFFF"/><rect x="40" y="40" width="300" height="130" rx="12" fill="#F8E7DA" stroke="#B85420" stroke-width="1.4"/><text x="56" y="66" font-size="16" font-weight="700" fill="#7C3511">Sentry 이슈 폴링</text><text x="56" y="87" font-size="12.5" fill="#5C5B55"></text><text x="56" y="106.0" font-size="12.5" fill="#5C5B55">백엔드가 2분마다 Sentry API를 읽음</text><text x="56" y="125.0" font-size="12.5" fill="#5C5B55">웹훅 대신 폴링 → 공개 엔드포인트 불필요</text><rect x="370" y="40" width="300" height="130" rx="12" fill="#F8E7DA" stroke="#B85420" stroke-width="1.4"/><text x="386" y="66" font-size="16" font-weight="700" fill="#7C3511">푸시 → 이슈 상세</text><text x="386" y="87" font-size="12.5" fill="#5C5B55"></text><text x="386" y="106.0" font-size="12.5" fill="#5C5B55">앱이 꺼짐·백그라운드·열림 어느 상태든</text><text x="386" y="125.0" font-size="12.5" fill="#5C5B55">딥링크로 같은 상세 화면에 도착</text><rect x="700" y="40" width="300" height="130" rx="12" fill="#F8E7DA" stroke="#B85420" stroke-width="1.4"/><text x="716" y="66" font-size="16" font-weight="700" fill="#7C3511">AI가 소스를 읽음</text><text x="716" y="87" font-size="12.5" fill="#5C5B55"></text><text x="716" y="106.0" font-size="12.5" fill="#5C5B55">스택의 파일을 읽는 도구(허용 폴더, 80줄씩)</text><text x="716" y="125.0" font-size="12.5" fill="#5C5B55">+ 배포 사실 4줄 → 원인·조치 JSON</text><rect x="40" y="230" width="300" height="130" rx="12" fill="#F8E7DA" stroke="#B85420" stroke-width="1.4"/><text x="56" y="256" font-size="16" font-weight="700" fill="#7C3511">블라인드 스와이프</text><text x="56" y="277" font-size="12.5" fill="#5C5B55"></text><text x="56" y="296.0" font-size="12.5" fill="#5C5B55">프롬프트 버전을 API 응답에서 지워</text><text x="56" y="315.0" font-size="12.5" fill="#5C5B55">평가자가 모르게 채점</text><rect x="370" y="230" width="300" height="130" rx="12" fill="#F8E7DA" stroke="#B85420" stroke-width="1.4"/><text x="386" y="256" font-size="16" font-weight="700" fill="#7C3511">버전별 승인율 · 별점</text><text x="386" y="277" font-size="12.5" fill="#5C5B55"></text><text x="386" y="296.0" font-size="12.5" fill="#5C5B55">같은 이슈를 4가지 구성으로 분석해</text><text x="386" y="315.0" font-size="12.5" fill="#5C5B55">채점 결과를 비교</text><rect x="700" y="230" width="300" height="130" rx="12" fill="#F8E7DA" stroke="#B85420" stroke-width="1.4"/><text x="716" y="256" font-size="16" font-weight="700" fill="#7C3511">고치고 다시 확인</text><text x="716" y="277" font-size="12.5" fill="#5C5B55"></text><text x="716" y="296.0" font-size="12.5" fill="#5C5B55">승인된 분석대로 고친 뒤</text><text x="716" y="315.0" font-size="12.5" fill="#5C5B55">재현 스크립트와 Sentry로 확인</text><text x="324" y="66" font-size="12" font-weight="700" fill="#B85420" text-anchor="end">1 · 수집</text><text x="654" y="66" font-size="12" font-weight="700" fill="#B85420" text-anchor="end">2 · 알림</text><text x="984" y="66" font-size="12" font-weight="700" fill="#B85420" text-anchor="end">3 · 분석</text><text x="324" y="256" font-size="12" font-weight="700" fill="#B85420" text-anchor="end">4 · 채점</text><text x="654" y="256" font-size="12" font-weight="700" fill="#B85420" text-anchor="end">5 · 비교</text><text x="984" y="256" font-size="12" font-weight="700" fill="#B85420" text-anchor="end">6 · 수정</text><path d="M340,105 L368,105" fill="none" stroke="#B85420" stroke-width="1.8" marker-end="url(#eo)"/><path d="M670,105 L698,105" fill="none" stroke="#B85420" stroke-width="1.8" marker-end="url(#eo)"/><path d="M850,170 L850,200 L190,200 L190,228" fill="none" stroke="#B85420" stroke-width="1.8" marker-end="url(#eo)"/><path d="M340,295 L368,295" fill="none" stroke="#B85420" stroke-width="1.8" marker-end="url(#eo)"/><path d="M670,295 L698,295" fill="none" stroke="#B85420" stroke-width="1.8" marker-end="url(#eo)"/><rect x="40" y="400" width="960" height="80" rx="12" fill="#FCFCFA" stroke="#A9A89E" stroke-width="1.4" stroke-dasharray="6 5"/><text x="56" y="426" font-size="15" font-weight="700" fill="#1A1A19">비밀 값은 모두 백엔드에만</text><text x="56" y="447" font-size="12.5" fill="#5C5B55">LLM 키 · Sentry 토큰 · GitHub 접근은 백엔드에 두고, 앱은 백엔드 API만 부릅니다.</text></svg>